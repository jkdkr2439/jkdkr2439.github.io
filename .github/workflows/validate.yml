name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-and-artifact:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/D_Data/config/dependencies/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/../bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source gates
        run: python -B -m P_Process.validation.run_all
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.5.23"
      - name: Install Writing dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Run Python contracts
        run: python -B -m unittest discover -s P_Process/tests -p 'test_*.py' -v
      - name: Run browser contracts
        run: |
          node --test P_Process/tests/platform/*.test.mjs
          node --check D_Display/assets/js/app.js
          node P_Process/tests/browser/test_canvas_store.js
      - name: Build public artifact
        run: python -B -m P_Process.build.build_site --destination _site
